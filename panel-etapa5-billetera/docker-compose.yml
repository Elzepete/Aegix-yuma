services:
  python-ml:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./python_engine:/app
    command: ["python3", "risk_engine.py"]
    environment:
      - PYTHON_ML_PORT=8001
    ports:
      - "8001:8001"
    restart: unless-stopped

  sentinel-go:
    image: golang:1.22-alpine
    working_dir: /app
    volumes:
      - ./sentinel-go:/app
    command: ["go", "run", "."]
    environment:
      - PYTHON_ML_URL=http://python-ml:8001
      - SENTINEL_HMAC_SECRET=${SENTINEL_HMAC_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      - python-ml
    restart: unless-stopped
